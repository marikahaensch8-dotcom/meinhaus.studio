<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://api.fontshare.com" crossorigin>
<link href="https://api.fontshare.com/v2/css?f[]=general-sans@300,400,500&display=swap" rel="stylesheet">
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #e0e0e0; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
    .banner {
        width: 1584px;
        height: 396px;
        background: #ffffff;
        display: flex;
        align-items: center;
        justify-content: flex-end;
        padding: 0 120px;
        font-family: 'General Sans', 'Helvetica Neue', sans-serif;
    }
    .content {
        text-align: right;
    }
    .headline {
        font-size: 48px;
        font-weight: 400;
        color: #1a1a1a;
        letter-spacing: -0.01em;
        line-height: 1.3;
    }
    .sub {
        font-size: 18px;
        font-weight: 300;
        color: #737373;
        margin-top: 12px;
        letter-spacing: 0.04em;
    }
</style>
</head>
<body>
    <div class="banner">
        <div class="content">
            <p class="headline">Every brand needs a home.</p>
            <p class="sub">meinhaus studio | Branding, Web & Creative Direction</p>
        </div>
    </div>
</body>
</html>
